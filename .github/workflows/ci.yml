name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t remi:ci .

  # Chưa từng chạy thử trên GitHub nên tạm cho phép lỗi. Việc E2 trong docs/TASKS.md là làm nó xanh ổn định rồi bỏ dòng continue-on-error.
  browser:
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install
      - run: npm run test:e2e
      - run: npm run test:responsive
      - run: npm run test:features
