name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install
      - run: npm test

  # Kiểm tra bản Next.js (bản deploy Vercel) build được.
  next-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # Chạy migration 001+002 trên Postgres thật, kiểm tra RLS và smoke test.
  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Tạo vai trò giống Supabase
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "create role anon; create role authenticated;"
      - name: Migration, RLS, smoke
        run: |
          for f in db/migrations/001_init.sql db/migrations/002_app.sql db/migrations/003_contact.sql db/migrations/004_tach_bang.sql db/verify-rls.sql db/smoke.sql db/test-tach-bang.sql; do
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Migration chạy lại không lỗi
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f db/migrations/002_app.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f db/migrations/003_contact.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f db/migrations/004_tach_bang.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f db/test-tach-bang.sql

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t remi:ci .

  # Chưa từng chạy thử trên GitHub nên tạm cho phép lỗi. Khi nó xanh ổn định thì bỏ dòng continue-on-error và đưa vào danh sách bắt buộc.
  browser:
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshot
          path: e2e-fail-*.png
      - run: npm run test:responsive
      - run: npm run test:features
      - run: npm run test:kitchen
