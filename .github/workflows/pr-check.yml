name: PR check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  link-issue:
    runs-on: ubuntu-latest
    steps:
      - name: PR phải nối với một issue (Closes #n)
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if echo "$BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+'; then
            echo "OK: PR đã nối issue."
          else
            echo "::error::Thân PR cần có dòng 'Closes #<số issue>'. Tạo issue trước rồi ghi vào PR."
            exit 1
          fi
      - name: Tiêu đề PR theo Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if echo "$TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|chore|ci|build)(\([^)]+\))?!?: .+'; then
            echo "OK: $TITLE"
          else
            echo "::error::Tiêu đề PR nên có dạng 'feat(lich): kéo thả việc', hiện là: $TITLE"
            exit 1
          fi
