<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Remi, trợ lý cá nhân</title>
<meta name="theme-color" content="#F26A1B">
<meta name="color-scheme" content="light">
<meta name="description" content="Remi nhắc việc, thói quen và đi chợ giúp bạn, có AI hiểu câu nói tự nhiên.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div id="alerts" aria-live="polite"></div>

<div id="app">
  <header class="top">
    <div class="hrow2"><h1 id="greet">Xin chào</h1><button class="avatar" id="me" type="button" aria-label="Tài khoản"></button></div>
    <div class="dl"><p id="dateline"></p><div class="clock" id="clock" aria-label="Giờ hiện tại"></div></div>
    <div class="next" id="next"></div>
  </header>

  <div class="col col-main">
  <section class="composer" id="composer" aria-label="Nhập việc cần nhớ">
    <div class="cwrap">
      <span class="spark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.3L20.5 10l-6.3 2.2L12 18.5l-2.2-6.3L3.5 10l6.3-1.7L12 2zm7 12l1 2.9 2.9 1-2.9 1-1 2.9-1-2.9-2.9-1 2.9-1 1-2.9z"/></svg></span>
      <textarea id="ta" rows="1" aria-label="Nói hoặc gõ điều bạn cần nhớ"></textarea>
      <div class="cbtns">
        <button class="icon-btn" id="mic" aria-label="Nói bằng giọng" type="button">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v4"/></svg>
        </button>
        <button class="send" id="send" type="button">
          Thêm
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
    <div class="thinking"><span class="pulse"><i></i><i></i><i></i></span>Remi đang hiểu ý bạn</div>
  </section>

  <section id="suggest" aria-label="Gợi ý có sẵn">
    <h2>Gợi ý cho bạn</h2>
    <div class="sgrid">
      <button type="button" data-ex="Uống nước mỗi ngày"><span class="se"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 6.2 6 11a6 6 0 01-12 0c0-4.8 6-11 6-11z"/></svg></span>Uống nước</button>
      <button type="button" data-ex="Đi chợ"><span class="se"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.2 10.5a2 2 0 002 1.5h7.6a2 2 0 002-1.5L20 8H6"/><circle cx="9" cy="20" r="1"/><circle cx="17" cy="20" r="1"/></svg></span>Đi chợ</button>
      <button type="button" data-ex="Đi bộ 30 phút mỗi sáng"><span class="se"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="4.5" r="1.8"/><path d="M10 21l2.5-6.5-2.5-2.5 1.5-4.5 3.5 1.5 2.5 3M9 11l-2.5 1.5"/></svg></span>Đi bộ</button>
      <button type="button" data-ex="Gọi điện cho bố mẹ vào chủ nhật hằng tuần"><span class="se"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0122 16.92z"/></svg></span>Gọi bố mẹ</button>
      <button type="button" data-ex="Tạo lịch họp"><span class="se"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg></span>Tạo lịch họp</button>
      <button type="button" data-ex="Thiền 10 phút trước khi ngủ mỗi tối"><span class="se"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21c-3.5 0-7-2.5-8-6 3 0 5.5 1.2 8 3.5C14.5 16.2 17 15 20 15c-1 3.5-4.5 6-8 6z"/><path d="M12 18.5C9.5 16 9 12 12 6c3 6 2.5 10 0 12.5z"/></svg></span>Thiền</button>
    </div>
  </section>

  <main>
    <div id="view-today"></div>
    <div id="view-soon" hidden></div>
    <div id="view-habits" hidden></div>
    <div id="view-cal" hidden></div>
  </main>
  </div>
  <aside class="col col-side">
  <section class="sleep" id="sleep" aria-label="Trạng thái ngủ và thức dậy"><div class="sinfo"><b id="sl-t"></b><span id="sl-s"></span></div><div class="strack" id="sl-track" role="switch" aria-checked="false" tabindex="0" aria-label="Đã thức dậy"><div class="sthumb" id="sl-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></div></div></section>

  <section class="quick" id="quick" aria-label="Tạo nhanh">
    <button class="qtile t-rem" type="button" data-new="reminder"><span class="qi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M5 3L2 6M22 6l-3-3"/></svg></span><b>Đặt nhắc hẹn</b></button>
    <button class="qtile t-cal" type="button" data-new="event"><span class="qi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18M12 13.5v5M9.5 16h5"/></svg></span><b>Hẹn lịch</b></button>
    <button class="qtile t-hab" type="button" data-new="habit"><span class="qi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-8"/><path d="M12 13c0-4 3-6 7-6 0 4-3 6-7 6z"/><path d="M12 16c0-3-2.5-5-6-5 0 3 2.5 5 6 5z"/></svg></span><b>Thêm thói quen</b></button>
  </section>

  <div id="today-habits"></div>
  </aside>
</div>

<nav class="tabs" aria-label="Điều hướng">
  <span class="brand"><img src="/icons/icon-192.png" alt="" width="44" height="44"><b>Remi</b></span>
  <div role="tablist">
    <button role="tab" aria-selected="true" data-tab="today">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      Hôm nay
    </button>
    <button role="tab" aria-selected="false" data-tab="cal">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>
      Lịch
    </button>
    <button role="tab" aria-selected="false" data-tab="soon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>
      Sắp tới
    </button>
    <button role="tab" aria-selected="false" data-tab="habits">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 6.2 6 11a6 6 0 01-12 0c0-4.8 6-11 6-11z"/></svg>
      Thói quen
    </button>
  </div>
</nav>

<div id="welcome" hidden></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Xác nhận"></div>
<script src="/js/api.js"></script>
<script src="/js/qty.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
