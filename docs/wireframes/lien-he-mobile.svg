-anchor="start">Điện thoại (&lt; 640px): một cột, thanh điều hướng dưới</text><text x="400" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222" font-weight="bold" text-anchor="start">Ghi chú hành vi</text><circle cx="410" cy="124" r="10" fill="#ff9f1c"/><text x="410" y="128" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="428" y="128" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444" font-weight="normal" text-anchor="start">Kiểm tra form bằng JavaScript: ô trống hoặc</text><text x="428" y="143" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444" font-weight="normal" text-anchor="start">sai định dạng thì báo lỗi ngay dưới ô, chưa</text><text x="428" y="158" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444" font-weight="normal" text-anchor="start">gửi.</text><circle cx="410" cy="183" r="10" fill="#ff9f1c"/><text x="410" y="187" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="428" y="187" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444" font-weight="normal" text-anchor="start">Gửi xong hiện thông báo thành công và xoá</text><text x="428" y="202" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444" font-weight="normal" text-anchor="start">nội dung form.</text><circle cx="410" cy="227" r="10" fill="#ff9f1c"/><text x="410" y="231" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="428" y="231" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444" font-weight="normal" text-anchor="start">Báo lỗi kỹ thuật: tạo Issue trên GitHub.</text><circle cx="410" cy="256" r="10" fill="#ff9f1c"/><text x="410" y="260" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#fff" font-weight="bold" text-anchor="midd