eight="normal" text-anchor="middle">Họ tên</text><text x="66.0" y="603" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#888" font-weight="normal" text-anchor="middle">Vai trò</text><circle cx="155.33333333333331" cy="546" r="22" fill="#fff" stroke="#888"/><text x="155.33333333333331" y="588" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#222" font-weight="normal" text-anchor="middle">Họ tên</text><text x="155.33333333333331" y="603" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#888" font-weight="normal" text-anchor="middle">Vai trò</text><circle cx="244.66666666666666" cy="546" r="22" fill="#fff" stroke="#888"/><text x="244.66666666666666" y="588" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#222" font-weight="normal" text-anchor="middle">Họ tên</text><text x="244.66666666666666" y="603" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#888" font-weight="normal" text-anchor="middle">Vai trò</text><circle cx="334.0" cy="546" r="22" fill="#fff" stroke="#888"/><text x="334.0" y="588" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#222" font-weight="normal" text-anchor="middle">Họ tên</text><text x="334.0" y="603" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#888" font-weight="normal" text-anchor="middle">Vai trò</text><line x1="20" y1="676" x2="380" y2="676" stroke="#ccc"/><circle cx="50.0" cy="698" r="9" fill="#f2f2f2"/><text x="50.0" y="722" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#888" font-weight="normal" text-anchor="middle">Hôm nay</text><circle cx="110.0" cy="698" r="9" fill="#f2f2f2"/><text x="110.0" y="722" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#888" font-weight="normal" text-anchor="middle">Lịch</text><circle cx="170.0" cy="698" r="9" fill="#f2f2f2"/><text x="170.0" y="722" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#888" font-weight="normal" text-anchor="middle">Sắp tới</text><circle cx="230.0" cy="698" r="9" fill="#f2f2f2"/><text x="230.0" y="722" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#888" font-weight="normal" text-anchor="middle">Thói quen</text><circle cx="290.0" cy="698" r="9" fill="#f2f2f2"/><text x="290.0" y="722" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#888" font-weight="normal" text-anchor="middle">Bếp</text><circle cx="350.0" cy="698" r="9" fill="#f2f2f2"/><text x="350.0" y="722" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#888" font-weight="normal" text-anchor="middle">Thống kê</text><text x="400" y="40" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#222" font-weight="bold" text-anchor="start">Giới thiệu</text><text x="400" y="62" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#888" font-weight="normal" text-anchor="start">Điện thoại (&lt; 640px): một cột, thanh điều hướng dưới</text><text x="400" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222" font-weight="bold" text-anchor="start">Ghi chú hành vi</text><circle cx="410" cy="124" r="10" fill="#ff9f1c"/><text x="410" y="128" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="428" y="128" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444" font-weight="normal" text-anchor="start">Nút Dùng thử dẫn tới trang đăng nhập / đăng</text><text x="428" y="143" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444" font-weight="normal" text-anchor="start">ký.</text><circle cx="410" cy="168" r="10" fill="#ff9f1c"/><text x="410" y="172" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="428" y="172" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444" font-weight="normal" text-anchor="start">Ba tính năng chính, mỗi thẻ một đến hai</text><text x="428" y="187" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444" font-weight="normal" text-anchor="start">dòng.</text><circle cx="410" cy="212" r="10" fill="#ff9f1c"/><text x="410" y="216" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="428" y="216" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444" font-weight="normal" text-anchor="start">Danh sách nhóm lấy từ bảng phân vai (họ tên,</text><text x="428" y="231" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444" font-weight="normal" text-anchor="start">vai trò).</text><circle cx="410" cy="256" r="10" fill="#ff9f1c"/><text x="410" y="260" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">4</text><text x="428" y="260" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444" font-weight="normal" text-anchor="start">Liên kết Giới thiệu và Liên hệ có ở mọi</text><text x="428" y="275" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444" font-weight="normal" text-anchor="start">trang: thanh bên (máy tính), góc trên phải</text><text x="428" y="290" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444" font-weight="normal" text-anchor="start">(điện thoại).</text></svg>