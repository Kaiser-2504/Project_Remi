<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 760" width="740" height="760"><rect width="100%" height="100%" fill="#fafafa"/><rect x="20" y="20" width="360" height="720" rx="28" fill="#fff" stroke="#222"/><text x="36" y="56" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5b6cff" font-weight="bold" text-anchor="start">Remi</text><text x="364" y="56" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#888" font-weight="normal" text-anchor="end">Liên hệ</text><text x="317" y="56" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#888" font-weight="normal" text-anchor="middle">·</text><text x="310" y="56" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5b6cff" font-weight="bold" text-anchor="end">Giới thiệu</text><circle cx="240" cy="52" r="10" fill="#ff9f1c"/><text x="240" y="56" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">4</text><text x="36" y="98" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#222" font-weight="bold" text-anchor="start">Giới thiệu</text><text x="36" y="132" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222" font-weight="bold" text-anchor="start">Trợ lý nhắc việc và thói quen cho cá nhân</text><text x="36" y="152" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#888" font-weight="normal" text-anchor="start">Nói một câu, Remi tạo nhắc hẹn, đi chợ, uống nước.</text><rect x="36" y="166" width="100" height="30" rx="15" fill="#5b6cff" stroke="#5b6cff"/><text x="86.0" y="186" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">Dùng thử</text><circle cx="152" cy="181" r="10" fill="#ff9f1c"/><text x="152" y="185" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">1</text><rect x="36" y="210" width="328" height="100" rx="4" fill="#fff" stroke="#888"/><line