="start">xem. Trên điện thoại, nhãn việc rút gọn</text><text x="428" y="260" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444" font-weight="normal" text-anchor="start">(Nước, Chợ, !) để không tràn ô; xem đầy đủ ở</text><text x="428" y="275" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444" font-weight="normal" text-anchor="start">trang Tháng.</text><circle cx="410" cy="300" r="10" fill="#ff9f1c"/><text x="410" y="304" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">5</text><text x="428" y="304" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444" font-weight="normal" text-anchor="start">Liên kết Giới thiệu và Liên hệ có ở mọi</text><text x="428" y="319" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444" font-weight="normal" text-anchor="start">trang: thanh bên (máy tính), góc trên phải</text><text x="428" y="334" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444" font-weight="normal" text-anchor="start">(điện thoại).</text></svg>